name: Promokody Tambov APK
on:
  push:
    branches: [ "promokody-tambov" ]
    paths:
      - "PromokodyTambov/**"
      - ".github/workflows/promokody-tambov-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic
      - name: Build debug APK
        run: gradle -p PromokodyTambov assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promokody-tambov-debug-apk
          path: PromokodyTambov/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
